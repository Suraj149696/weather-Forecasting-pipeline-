name: Weather Forecast Pipeline

on:
  workflow_dispatch:

  # Daily Schedule → 6:00 AM IST
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: write

jobs:
  weather-pipeline:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # 1. Checkout Repository
      # -----------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------
      # 2. Setup Python
      # -----------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------------
      # 3. Install Dependencies
      # -----------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------
      # 4. Extract Weather Data
      # -----------------------------------
      - name: Extract Weather Data
        run: python -m crs.extract.extract_api

      # -----------------------------------
      # 5. Transform Weather Data
      # -----------------------------------
      - name: Transform Weather Data
        run: python -m crs.transform.transform_api

      # -----------------------------------
      # 6. Generate Forecast
      # -----------------------------------
      - name: Generate Forecast
        run: python -m crs.model.predict

      # -----------------------------------
      # 7. Print Current UTC Time
      # -----------------------------------
      - name: Print Current Time
        run: |
          echo "Current UTC Time:"
          date

      # -----------------------------------
      # 8. Commit and Push Updated Files
      # -----------------------------------
      - name: Commit and Push Forecast Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data/
          git add logs/

          git commit -m "Auto update forecast [$(date '+%Y-%m-%d %H:%M')]" || echo "No changes"

          git pull origin main --rebase
          git push origin main
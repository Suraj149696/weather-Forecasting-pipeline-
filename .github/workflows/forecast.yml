name: Weather Forecast Pipeline

on:

  workflow_dispatch:

  schedule:
    - cron: "45 13 * * *"

permissions:
  contents: write

jobs:

  weather-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Weather Data
        run: python -m crs.extract.extract_api

      - name: Transform Weather Data
        run: python -m crs.transform.transform_api

      - name: Generate Forecast
        run: python -m crs.model.predict

      - name: Commit Forecast JSON
        run: |

      - name: Commit and Push Forecast Files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data/
          git add logs/

          git commit -m "Auto update forecast" || echo "No changes"

          git pull origin main --rebase

          git push origin main